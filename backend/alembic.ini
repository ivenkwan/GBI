# Alembic configuration for GenBI.
#
# The SQLAlchemy URL is intentionally left empty — it is overridden at runtime
# by backend/app/db/migrations/env.py from settings.DATABASE_URL_SYNC.
#
# Run:
#   cd backend
#   uv run alembic upgrade head     # apply migrations
#   uv run alembic current          # show current revision

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
