# GenBI dev stack.
#
# Host-side ports are env-overridable (defaults unchanged) so the stack can
# coexist with other local services: GENBI_HOST_PG_PORT, GENBI_HOST_REDIS_PORT,
# GENBI_HOST_FRONTEND_PORT, GENBI_HOST_CUBE_PORT, GENBI_HOST_GRAFANA_PORT,
# GENBI_HOST_PROM_PORT. The demo CLI (scripts/demo.py) auto-picks free
# alternates and threads the same variables into scripts/verify.sh. The
# backend stays fixed on 8000 (the frontend's NEXT_PUBLIC_API_URL points at it).
services:
  # =========================================================================
  # Core Services
  # =========================================================================
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: genbi/postgres-pgvector-age:pg16
    container_name: genbi-postgres
    environment:
      POSTGRES_USER: genbi
      POSTGRES_PASSWORD: genbi
      POSTGRES_DB: genbi
      # Opt out of AGE at boot if you don't need lineage (dev convenience).
      GENBI_ENABLE_AGE: ${GENBI_ENABLE_AGE:-true}
    ports:
      - "${GENBI_HOST_PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Numeric prefixes force the apply order under ANY collation (digits
      # sort before letters in the container's C locale, which put a 99-
      # prefix FIRST and aborted init before init.sql created the roles).
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./postgres/age-lineage.sql:/docker-entrypoint-initdb.d/02-age-lineage.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genbi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: genbi-redis
    ports:
      - "${GENBI_HOST_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Application Services
  # =========================================================================
  backend:
    build:
      context: ..          # repo root, so .claude/prompts is in-context
      dockerfile: backend/Dockerfile
    container_name: genbi-backend
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../scripts:/app/scripts:ro
      - ../.claude/prompts:/app/.claude/prompts:ro
      - flint_data:/tmp/genbi-charts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # NOTE: --reload removed — WatchFiles over a Windows bind mount (host
    # Z:\GITHUB\GBI\backend:/app) scans .venv too and the worker never starts.
    # Backend code changes: `docker compose restart backend`.
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # Dev runs from the builder stage — it has pnpm + full node_modules;
      # the production stage is a standalone bundle with neither.
      target: builder
    container_name: genbi-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "${GENBI_HOST_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: pnpm dev

  # =========================================================================
  # Semantic Layer
  # =========================================================================
  cube:
    image: cubejs/cube:latest
    container_name: genbi-cube
    env_file:
      - ../semantic/cube/.env
    ports:
      - "${GENBI_HOST_CUBE_PORT:-4000}:4000"
    volumes:
      - ../semantic/cube:/cube/conf
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================================
  # Observability
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: genbi-prometheus
    ports:
      - "${GENBI_HOST_PROM_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: genbi-grafana
    ports:
      - "${GENBI_HOST_GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

  otel_collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: genbi-otel
    ports:
      - "4318:4318"
      - "8888:8888"

volumes:
  postgres_data:
  flint_data:
