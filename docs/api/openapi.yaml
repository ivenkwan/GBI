openapi: 3.1.0
info:
  title: GenBI API
  version: 0.1.0
  description: Generative BI Platform API
servers:
  - url: http://localhost:8000/api/v1
    description: Development

paths:
  /health:
    get:
      operationId: health_check
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /chat:
    post:
      operationId: chat
      summary: Natural language to SQL + chart + narrative
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat response with SQL, chart, and narrative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /charts/render:
    post:
      operationId: render_chart
      summary: Render a chart via Flint MCP
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartRenderRequest"
      responses:
        "200":
          description: Rendered chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartRenderResponse"

  /chat/feedback:
    post:
      operationId: chat_feedback
      summary: Thumbs up/down on a chat response (session_id keyed)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, score]
              properties:
                session_id:
                  type: string
                  format: uuid
                score:
                  type: integer
                  enum: [-1, 0, 1]
      responses:
        "200":
          description: Recorded
        "503":
          description: FEEDBACK_UNAVAILABLE

  /metrics/list:
    get:
      operationId: list_metrics
      summary: Semantic-layer metric catalog (cached; ?refresh=true bypasses)
      security:
        - BearerAuth: []
      parameters:
        - name: refresh
          in: query
          schema:
            type: boolean
          description: Bypass the cache and re-fetch Cube /meta
      responses:
        "200":
          description: Metric catalog
        "503":
          description: CUBE_UNAVAILABLE (no cached fallback available)

  /reports/generate:
    post:
      operationId: generate_report
      summary: LLM-planned multi-chart report from a prompt
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Generated report
        "503":
          description: REPORT_GENERATION_FAILED

  /reports/{report_id}/regenerate:
    post:
      operationId: regenerate_report
      summary: Re-run a report's pipeline on its stored prompt, in place
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Regenerated report (same id)
        "404":
          description: REPORT_NOT_FOUND
        "503":
          description: REPORT_GENERATION_FAILED

  /reports/{report_id}/schedule:
    post:
      operationId: schedule_report
      summary: Create/replace the regeneration schedule (hourly|daily|weekly|monthly)
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Schedule state
    get:
      operationId: get_report_schedule
      summary: The report's schedule, if any
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Schedule state
        "404":
          description: SCHEDULE_NOT_FOUND
    delete:
      operationId: unschedule_report
      summary: Remove the schedule
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Removed

  /reports/{report_id}/pdf:
    get:
      operationId: export_report_pdf
      summary: Export a report as PDF (charts rasterize when cairosvg is present)
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: REPORT_NOT_FOUND

  /dashboards:
    post:
      operationId: create_dashboard
      summary: Create an empty dashboard
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Created
    get:
      operationId: list_dashboards
      summary: The user's dashboards
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard list

  /dashboards/{dashboard_id}:
    get:
      operationId: get_dashboard
      summary: One dashboard with pinned sections resolved to chart data
      security:
        - BearerAuth: []
      parameters:
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dashboard detail
        "404":
          description: DASHBOARD_NOT_FOUND
    delete:
      operationId: delete_dashboard
      summary: Delete a dashboard (pins cascade; reports untouched)
      security:
        - BearerAuth: []
      parameters:
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted

  /dashboards/{dashboard_id}/sections:
    post:
      operationId: pin_section
      summary: Pin a report section onto the dashboard (refreshes DASHBOARD_USES lineage)
      security:
        - BearerAuth: []
      parameters:
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_id, section_position]
              properties:
                report_id:
                  type: string
                  format: uuid
                section_position:
                  type: integer
      responses:
        "201":
          description: Pinned
        "404":
          description: SECTION_NOT_FOUND

  /dashboards/{dashboard_id}/sections/{pin_id}:
    delete:
      operationId: unpin_section
      summary: Remove one pin
      security:
        - BearerAuth: []
      parameters:
        - name: dashboard_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pin_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Removed
        "404":
          description: PIN_NOT_FOUND

  /lineage/impact/{table_name}:
    get:
      operationId: table_impact
      summary: Downstream metrics + dashboards affected by a table change (AGE)
      security:
        - BearerAuth: []
      parameters:
        - name: table_name
          in: path
          required: true
          schema:
            type: string
          description: Optionally schema-qualified relation name
      responses:
        "200":
          description: Impact entries
        "400":
          description: INVALID_NAME
        "503":
          description: LINEAGE_UNAVAILABLE

  /lineage/metric/{metric_name}:
    get:
      operationId: metric_lineage
      summary: A metric's source columns and the dashboards pinning it (AGE)
      security:
        - BearerAuth: []
      parameters:
        - name: metric_name
          in: path
          required: true
          schema:
            type: string
          description: Cube-qualified measure name (cube.measure)
      responses:
        "200":
          description: Lineage detail
        "400":
          description: INVALID_NAME
        "503":
          description: LINEAGE_UNAVAILABLE

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string

    ChatRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 5000
        conversation_id:
          type: string
        confirm_large_query:
          type: boolean
          default: false
          description: Explicit confirmation to run a query whose EXPLAIN row estimate exceeds 1M rows

    ChatResponse:
      type: object
      properties:
        conversation_id:
          type: string
        query:
          type: string
        sql:
          type: string
        sql_explanation:
          type: string
        chart_spec:
          type: object
        narrative:
          type: string
        chart_image_base64:
          type: string
        warnings:
          type: array
          items:
            type: string
        requires_confirmation:
          type: boolean
          description: True when the query needs explicit confirmation before execution
        row_estimate:
          type: integer
          nullable: true
          description: EXPLAIN-estimated row count, when available

    ChartRenderRequest:
      type: object
      required: [spec]
      properties:
        spec:
          $ref: "#/components/schemas/ChartAssemblyInput"
        backend:
          type: string
          enum: [vegalite, echarts, chartjs]
          default: vegalite
        format:
          type: string
          enum: [png, svg]
          default: png

    ChartRenderResponse:
      type: object
      properties:
        success:
          type: boolean
        format:
          type: string
        image_base64:
          type: string
        svg:
          type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string

    ChartAssemblyInput:
      type: object
      required: [chartType, data]
      properties:
        chartType:
          type: string
        encodings:
          type: object
        baseSize:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
        semantic_types:
          type: object
        data:
          type: object
          properties:
            values:
              type: array
            url:
              type: string
