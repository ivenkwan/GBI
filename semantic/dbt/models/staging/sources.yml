version: 2

sources:
  - name: raw
    schema: "{{ var('source_schema') }}"
    tables:
      - name: transactions
        description: "Raw transaction records from the OLTP system"
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: customer_id
            tests:
              - not_null
          - name: amount
            tests:
              - not_null
          - name: region
          - name: product_category
          - name: created_at
            tests:
              - not_null
