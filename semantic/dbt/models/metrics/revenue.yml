version: 2

metrics:
  - name: revenue_total
    label: "Total Revenue"
    description: "Sum of all recognized revenue"
    type: sum
    type_params:
      measure: revenue_amount

  - name: revenue_growth_pct
    label: "Revenue Growth %"
    description: "Period-over-period revenue growth rate"
    type: derived
    type_params:
      expr: (revenue_total - revenue_prev_period) / revenue_prev_period * 100
      metrics:
        - name: revenue_total
        - name: revenue_prev_period
          offset_window: 1 period

  - name: active_users
    label: "Active Users"
    description: "Count of distinct active users"
    type: count_distinct
    type_params:
      measure: user_id

  - name: conversion_rate
    label: "Conversion Rate"
    description: "Percentage of users who converted"
    type: ratio
    type_params:
      numerator: conversions
      denominator: total_users

semantic_models:
  - name: revenue
    description: "Revenue transactions"
    defaults:
      agg_time_dimension: transaction_date
    model: ref("stg_revenue")
    entities:
      - name: transaction
        type: primary
        expr: transaction_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: transaction_date
        type: time
        type_params:
          time_granularity: day
      - name: region
        type: categorical
      - name: product_category
        type: categorical
    measures:
      - name: revenue_amount
        description: "The transaction revenue amount"
        agg: sum
      - name: transaction_count
        description: "Number of transactions"
        agg: count
