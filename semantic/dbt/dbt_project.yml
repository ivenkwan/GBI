name: "genbi_semantic"
version: "0.1.0"
config-version: 2

profile: "genbi"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  genbi_semantic:
    staging:
      +materialized: view
      +schema: staging
    metrics:
      +materialized: table
      +schema: metrics
    marts:
      +materialized: table
      +schema: marts

vars:
  # Override in profiles.yml per environment
  source_schema: "public"
  tenant_column: "tenant_id"
