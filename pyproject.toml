[project]
name = "genbi"
version = "0.1.0"
description = "Generative BI Platform — NL2SQL, auto-visualization, narrative insights"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Iven Kwan"}
]
keywords = ["bi", "nl2sql", "generative-ai", "data-visualization", "agentic"]

[tool.uv.workspace]
members = ["backend"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line-too-long handled by formatter

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# N815: chartType/baseSize are the Flint chart-spec JSON keys — must keep casing.
"backend/app/models/chart.py" = ["N815"]
# F841: ingest_table's cypher execute is side-effect-only (result intentionally
# unread). Parameterizing the AGE cypher queries is a tracked follow-up.
"backend/app/db/graph_schema.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = [
    "unit: unit tests (fast, no external services)",
    "integration: integration tests (requires test DB/Redis)",
    "e2e: end-to-end tests (full pipeline, slow)",
]
